{% extends "base_public.html" %}
{% block title %}Log in{% endblock %}
{% block page %}login{% endblock %}
{% block content %}
<h1>Welcome back</h1>
<p class="muted">Log in to your reminders and safety tools.</p>
<form method="post" action="{{ url_for('login') }}" class="form" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
  <button id="login-submit" class="btn btn-primary btn-block" type="submit">Log in</button>
</form>
<p class="auth-alt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
<p class="auth-alt small"><a href="{{ url_for('admin_login') }}">Admin login</a></p>
<div class="demo-note">Demo account: <code>demo@example.com</code> / <code>Demo@1234</code></div>
{% endblock %}
